name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" >/dev/null 2>&1 || echo "platform already present"

      - name: Prepare signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_B64" ]]; then
            echo "$RELEASE_KEYSTORE_B64" > "$RUNNER_TEMP/ks.b64"
            tr -d '\r\n' < "$RUNNER_TEMP/ks.b64" > "$RUNNER_TEMP/ks.clean"
            base64 -d "$RUNNER_TEMP/ks.clean" > "$RUNNER_TEMP/release.keystore"
          else
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="build-$(date +'%Y%m%d-%H%M%S')"
          fi
          gh release create "$TAG" app/build/outputs/apk/release/*.apk --generate-notes
